version: 2

before:
  hooks:
    - go test ./...

builds:
  - id: tmm
    dir: .
    main: ./cmd/tmm
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/nickadminroot/tmm/apps/tmm-cli/internal/client.Version={{ .Version }}
      - -X github.com/nickadminroot/tmm/apps/tmm-cli/internal/client.DefaultBaseURL={{ .Env.TMM_PRODUCTION_API_URL }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
