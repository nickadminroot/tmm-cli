# One H-pose of a slider-crank synthesized from two positions.
schema: linkage/v2
units: SI
output_body: "3"
gravity: [0.0, -9.81, 0.0]

parameters:
  l_AB: 0.11327540717342367
  l_BC: 0.2831885179335592
  y_slider: 0.04531016286936947
  phi_1: 60.0
  omega_1: 8.0
  alpha_1: 0.0

geometry:
  points:
    O: [0.0, 0.0]
  construct:
    - type: point_on_ray
      point: B
      from: O
      length: l_AB
      angle_deg: phi_1
    - type: circle_line_y
      point: C
      center: B
      radius: l_BC
      y: y_slider
      branch: right
  aliases: {}

bodies:
  "1":
    type: rigid
    points: [O, B]
    frame: {origin: O, x_axis: {through: B}}
    com: mid
    mass: 2.0
    inertia: 0.03
  "2":
    type: rigid
    points: [B, C]
    frame: {origin: B, x_axis: {through: C}}
    com: mid
    mass: 3.0
    inertia: 0.08
  "3":
    type: slider
    points: [C]
    frame: {origin: C}
    com: C
    mass: 1.0
    inertia: 0.01

joints:
  - id: O
    type: revolute
    endpoints: [{body: ground, point: O}, {body: "1", point: O}]
  - id: B
    type: revolute
    endpoints: [{body: "1", point: B}, {body: "2", point: B}]
  - id: C
    type: revolute
    endpoints: [{body: "2", point: C}, {body: "3", point: C}]
  - id: H
    type: prismatic
    guide:
      body: ground
      axis: {origin: [0.0, 0.04531016286936947], angle_deg: 0.0}
    slider: {body: "3", point: C}

drive: {body: "1", q_ratio: 1, omega: omega_1, alpha: alpha_1}
loads: []
