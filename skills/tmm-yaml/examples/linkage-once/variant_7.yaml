    type: rigid
    points: [O, A, S1]
    frame: {origin: O, x_axis: {through: A}}
    mass: 26.0
    inertia: 10.0
    com: S1
  "2":
    type: rigid
    points: [A, B, S2]
    frame: {origin: A, x_axis: {through: B}}
    mass: 30.0
    inertia: 2.5
    com: S2
  "3":
    type: rigid
    points: [C, B, D, S3]
    frame: {origin: C, x_axis: {through: B}}
    mass: 25.0
    inertia: 2.0
    com: S3
  "4":
    type: rigid
    points: [D, E, S4]
    frame: {origin: D, x_axis: {through: E}}
    mass: 10.0
    inertia: 1.0
    com: S4
  "5":
    type: slider
    points: [E, S5]
    frame: {origin: E}
    mass: 0.0
    inertia: 0.0
    com: S5
joints:
- id: O
  type: revolute
  endpoints:
  - {body: ground, point: O}
  - {body: "1", point: O}
- id: A
  type: revolute
  endpoints:
