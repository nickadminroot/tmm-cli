  - {body: "2", point: A}
- id: C
  type: revolute
  endpoints:
  - {body: ground, point: C}
  - {body: "3", point: C}
- id: B
  type: revolute
  endpoints:
  - {body: "2", point: B}
  - {body: "3", point: B}
- id: D
  type: revolute
  endpoints:
  - {body: "3", point: D}
  - {body: "4", point: D}
- id: E
  type: revolute
  endpoints:
  - {body: "4", point: E}
  - {body: "5", point: E}
- id: H
  type: prismatic
  guide:
    body: "2"
    axis: {origin: A, angle_deg: slot_angle_AB}
  slider: {body: "5", point: E}
drive: {body: "1", q_ratio: 1, omega: omega_1, alpha: epsilon_1}
loads:
- id: F5
  body: "5"
  point: E
  vector: [499.8498, -12.2506, 0]