schema: linkage/v2
units: SI
gravity: [0, -9.81, 0]
parameters: {l_OC: 1.0, l_OA: 0.5, l_AB: 1.0, l_CB: 1.0, l_CD: 1.5, l_DE: 1.8, l_DS4: 0.5, phi_1: -15.0, slot_angle_AB: 90.0, omega_1: 10.0, epsilon_1: 50.0}
geometry:
  points:
    O: [0.0, 0.0]
  construct:
