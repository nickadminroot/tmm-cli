  - {type: point_on_ray, point: A, from: O, length: l_OA, angle_deg: phi_1}
  - {type: circle_circle, point: B, center1: A, radius1: l_AB, center2: C, radius2: l_CB, branch: upper}
  - {type: point_on_line, point: D, from: C, to: B, distance: l_CD}
  - {type: circle_ray, point: E, from: A, through: B, rotate_deg: slot_angle_AB, center: D, radius: l_DE, branch: positive}
  - {type: point_on_line, point: S2, from: A, to: B, fraction: 0.5}
  - {type: point_on_line, point: S4, from: D, to: E, distance: l_DS4}
  aliases: {S1: O, S3: C, S5: E}
bodies:
