# Axial slider-crank with the synthesized mean-speed dimensions.
schema: linkage/v2
units: SI
output_body: "3"
gravity: [0.0, -9.81, 0.0]

parameters:
  l_AB: 0.0625
  l_BC: 0.2
  y_slider: 0.0
  phi_1: 40.0
  omega_1: 37.69911184307752
  alpha_1: 0.0
  n_1: 6.0

geometry:
  points:
    O: [0.0, 0.0]
  construct:
    - type: point_on_ray
      point: B
      from: O
      length: l_AB
      angle_deg: phi_1
    - type: circle_line_y
      point: C
      center: B
      radius: l_BC
      y: y_slider
      branch: right
  aliases: {}

bodies:
  "1":
    type: rigid
    points: [O, B]
    frame: {origin: O, x_axis: {through: B}}
    mass: 1.5
    inertia: 0.02
    com: mid
  "2":
    type: rigid
    points: [B, C]
    frame: {origin: B, x_axis: {through: C}}
    mass: 2.5
    inertia: 0.05
    com: mid
  "3":
    type: slider
    points: [C]
    frame: {origin: C}
    mass: 0.8
    inertia: 0.008
    com: C

joints:
  - id: O
    type: revolute
    endpoints: [{body: ground, point: O}, {body: "1", point: O}]
  - id: B
    type: revolute
    endpoints: [{body: "1", point: B}, {body: "2", point: B}]
  - id: C
    type: revolute
    endpoints: [{body: "2", point: C}, {body: "3", point: C}]
  - id: H
    type: prismatic
    guide:
      body: ground
      axis: {origin: [0.0, 0.0], angle_deg: 0.0}
    slider: {body: "3", point: C}

drive: {body: "1", q_ratio: 1, omega: omega_1, alpha: alpha_1}
loads: []
